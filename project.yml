# Regenerate after adding files: xcodegen generate (commit the resulting GlookoService.xcodeproj).
# Built from LoopWorkspace; LoopKit and LoopKitUI come from the workspace's built products.
name: GlookoService
options:
  bundleIdPrefix: com.loopkit
  deploymentTarget:
    iOS: "15.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SKIP_INSTALL: YES
    SUPPORTS_MACCATALYST: NO
    DEFINES_MODULE: YES
    LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]
targets:
  GlookoServiceTestHost:
    type: application
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Tests/GlookoServiceKitTests/Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopkit.GlookoServiceTestHost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Tests/GlookoServiceKitTests/Host/Host.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
  GlookoServiceKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.6"
    sources:
      - path: Tests/GlookoServiceKitTests
        excludes: [Host]
    dependencies:
      - target: GlookoServiceTestHost
      - target: GlookoServiceKit
        embed: true
        codeSign: false
      - framework: LoopKit.framework
        embed: true
        codeSign: false
        implicit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopkit.GlookoServiceKitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GlookoServiceTestHost.app/GlookoServiceTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GlookoServiceKit:
    type: framework
    platform: iOS
    sources:
      - path: GlookoKit
      - path: GlookoServiceKit
    dependencies:
      - framework: LoopKit.framework
        embed: false
        implicit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopkit.GlookoServiceKit
        GENERATE_INFOPLIST_FILE: YES
  GlookoServiceKitUI:
    type: framework
    platform: iOS
    sources:
      - path: GlookoServiceKitUI
    postBuildScripts:
      - name: Capture Glooko build
        script: /bin/sh "${SRCROOT}/Scripts/capture-build-details.sh"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Scripts/capture-build-details.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GlookoBuild.plist
    dependencies:
      - target: GlookoServiceKit
        embed: false
      - framework: LoopKit.framework
        embed: false
        implicit: true
      - framework: LoopKitUI.framework
        embed: false
        implicit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loopkit.GlookoServiceKitUI
        GENERATE_INFOPLIST_FILE: YES
  GlookoServiceKitPlugin:
    type: framework
    platform: iOS
    sources:
      - path: GlookoServiceKitPlugin
    dependencies:
      # Embedded in the plugin's Frameworks folder; Loop's copy-plugins.sh moves them into the app.
      - target: GlookoServiceKit
        embed: true
        codeSign: false
      - target: GlookoServiceKitUI
        embed: true
        codeSign: false
      - framework: LoopKit.framework
        embed: false
        implicit: true
      - framework: LoopKitUI.framework
        embed: false
        implicit: true
    settings:
      base:
        WRAPPER_EXTENSION: loopplugin
        PRODUCT_NAME: GlookoServiceKitPlugin
        PRODUCT_BUNDLE_IDENTIFIER: com.loopkit.GlookoServiceKitPlugin
        INFOPLIST_FILE: GlookoServiceKitPlugin/Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  GlookoServiceTests:
    build:
      targets:
        GlookoServiceKit: all
        GlookoServiceKitTests: [test]
    test:
      targets:
        - name: GlookoServiceKitTests
          parallelizable: false
